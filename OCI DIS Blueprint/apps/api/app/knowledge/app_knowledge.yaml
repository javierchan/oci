version: 1.1.0
sections:
  - id: identity-access
    name: Identity and access
    purpose: Bootstrap the first administrator, authenticate local users, manage App roles and project memberships, rotate passwords, and issue least-privilege read-only API tokens for external clients.
    purpose_es: Crear de forma segura el primer administrador, autenticar usuarios locales, administrar roles y membresías por proyecto, rotar contraseñas y emitir tokens API de solo lectura con privilegio mínimo.
    when_to_use: Use the one-shot bootstrap only for a new installation, Account for your own password and API tokens, and User Management to create, rename, assign, disable, or reset local users.
    when_to_use_es: Usa el bootstrap de una sola ejecución únicamente en una instalación nueva, Account para tu contraseña y tokens, y User Management para crear, renombrar, asignar, desactivar o restablecer usuarios locales.
    steps:
      - Sign in with the local username and password provisioned by an administrator.
      - Open the avatar menu for Account security or, when authorized, User management.
      - Assign the App role and explicit project memberships, then create API tokens with only the required read scopes and project subset.
    steps_es:
      - Inicia sesión con el usuario local y contraseña provisionados por un administrador.
      - Abre el menú del avatar para Account security o, si estás autorizado, User management.
      - Asigna rol y proyectos, y crea tokens únicamente con los permisos de lectura y proyectos necesarios.
    routes: ["/login", "/account", "/admin/users"]
    endpoints:
      - { method: POST, path: /api/v1/auth/login }
      - { method: GET, path: /api/v1/auth/me }
      - { method: GET, path: /api/v1/auth/api-token-scopes }
      - { method: POST, path: /api/v1/auth/api-tokens }
      - { method: GET, path: /api/v1/admin/users }
      - { method: PATCH, path: "/api/v1/admin/users/{user_id}" }
      - { method: PUT, path: "/api/v1/admin/users/{user_id}/memberships" }
    exports: []
    entities: [AppUser, AuthIdentity, LocalCredential, AuthSession, ApiToken, ProjectMembership]
    supported_actions: [bootstrap first administrator, sign in locally, change password, edit username, create user, assign App role, assign project membership, create scoped API token, revoke API token, sign out]
    unsupported_claims: [public self-registration, automatic second administrator bootstrap, API token write access, token permission beyond current user access, OCI IAM sign-in today]
    keywords: [installation, onboarding, bootstrap, initial admin, login, sign in, account, user management, username, password, role, permissions, membership, API token, Codex, authentication, instalación, usuario, contraseña, permisos]

  - id: projects
    name: Projects
    purpose: Create and manage isolated architecture assessment workspaces, then review each project's technical dashboard and governed lifecycle.
    purpose_es: Crear y administrar espacios aislados de evaluación de arquitectura, y revisar el dashboard técnico y el ciclo de vida gobernado de cada proyecto.
    when_to_use: Start here to select a customer assessment, create a project, inspect its latest technical snapshot, or archive completed work.
    when_to_use_es: Usa Projects para seleccionar una evaluación de cliente, crear un proyecto, revisar su snapshot técnico o archivar trabajo concluido.
    steps:
      - Open Projects and select or create an assessment workspace.
      - Open the project dashboard to review integration coverage, captured products, maturity, and prioritized risks.
      - Continue to Import, Capture, Catalog, Map, or BOM & Cost for the decision you need to make.
    steps_es:
      - Abre Projects y selecciona o crea el espacio de evaluación.
      - Entra al dashboard del proyecto para revisar cobertura, productos capturados, madurez y riesgos priorizados.
      - Continúa a Import, Capture, Catalog, Map o BOM & Cost según la decisión que necesites.
    routes:
      - /
      - /projects
      - /projects/[projectId]
      - /projects/[projectId]/capture
      - /projects/[projectId]/capture/new
      - /projects/[projectId]/graph
      - /projects/[projectId]/map
    endpoints:
      - { method: GET, path: /api/v1/projects/ }
      - { method: POST, path: /api/v1/projects/ }
      - { method: GET, path: "/api/v1/projects/{project_id}" }
      - { method: PATCH, path: "/api/v1/projects/{project_id}" }
      - { method: POST, path: "/api/v1/projects/{project_id}/archive" }
      - { method: GET, path: "/api/v1/dashboard/{project_id}/snapshots" }
      - { method: GET, path: "/api/v1/catalog/{project_id}/graph" }
    exports:
      - method: GET
        path: /api/v1/exports/{project_id}/brief
        media_types: [text/markdown; charset=utf-8]
    entities: [Project, DashboardSnapshot, VolumetrySnapshot, AuditEvent]
    supported_actions: [create project, open dashboard, archive project, inspect technical snapshot, open map, download executive brief]
    unsupported_claims: [delete all customer data automatically, publish a customer quote from the dashboard]
    keywords: [project, proyecto, projects, dashboard, tablero, capture, captura, map, mapa, topology, topología, technical snapshot, assessment, evaluación]

  - id: import
    name: Import
    purpose: Ingest an official or external workbook through governed parsing, mapping review, lineage preservation, and controlled catalog materialization.
    purpose_es: Ingerir un workbook oficial o externo mediante parsing gobernado, revisión de mapeo, preservación de linaje y materialización controlada en el catálogo.
    when_to_use: Use Import when integration information already exists in a workbook or when an external file needs explicit mapping decisions before catalog creation.
    when_to_use_es: Usa Import cuando la información ya existe en un workbook o un archivo externo requiere decisiones explícitas de mapeo antes de crear el catálogo.
    steps:
      - Download the official template or choose a workbook to upload.
      - Review the staged mapping contract and resolve each ambiguous external column by mapping it to an existing governed attribute or explicitly excluding it.
      - Approve the mapping contract, then inspect loaded, technical-only, and excluded rows with their source lineage.
    steps_es:
      - Descarga el template oficial o selecciona el workbook que vas a cargar.
      - Revisa el contrato de mapeo y resuelve cada columna ambigua asignándola a un atributo gobernado existente o excluyéndola explícitamente.
      - Aprueba el mapeo y revisa las filas cargadas, técnicas y excluidas con su linaje.
    routes: ["/projects/[projectId]/import"]
    endpoints:
      - { method: POST, path: "/api/v1/imports/{project_id}" }
      - { method: GET, path: "/api/v1/imports/{project_id}/{batch_id}" }
      - { method: PATCH, path: "/api/v1/imports/{project_id}/{batch_id}/mapping-review" }
      - { method: POST, path: "/api/v1/imports/{project_id}/{batch_id}/mapping-review/approve" }
      - { method: GET, path: "/api/v1/imports/{project_id}/{batch_id}/rows" }
    exports:
      - method: GET
        path: /api/v1/exports/template/xlsx
        media_types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
      - method: GET
        path: /api/v1/exports/{project_id}/template/xlsx
        media_types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
    entities: [ImportBatch, ImportMappingProfile, SourceIntegrationRow, CatalogIntegration]
    supported_actions: [download template, upload workbook, review mappings, approve mapping contract, inspect source rows, remove import batch]
    unsupported_claims: [silently repair ambiguous source data, accept workbook formulas, create arbitrary target fields during import, crear campos arbitrarios durante la importación, bypass mapping approval]
    keywords: [import, importar, workbook, archivo, template, external file, mapping, lineage, spreadsheet, rows, filas]

  - id: capture-review
    name: Capture Review
    purpose: Stage external customer integration evidence as immutable source rows and editable governed proposals so dictionary mappings, required gaps, payload semantics, TBQ scope, and pattern recommendations can be reviewed before catalog promotion.
    when_to_use: Use Capture Review when customer data does not follow the official template or needs line-by-line normalization without uploading the source workbook into the App.
    steps:
      - Open the project Capture Review session and confirm the customer, source hash, row counts, and normalization policy.
      - Inspect each immutable source row beside its editable proposal, then resolve required evidence gaps and validate the recommended pattern.
      - Approve schema-ready proposals explicitly and promote only accepted rows through the governed manual-capture path.
    routes: ["/projects/[projectId]/capture-review"]
    endpoints:
      - { method: GET, path: "/api/v1/projects/{project_id}/external-capture/sessions" }
      - { method: POST, path: "/api/v1/projects/{project_id}/external-capture/sessions" }
      - { method: GET, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}" }
      - { method: POST, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}/drafts/bulk" }
      - { method: GET, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}/drafts" }
      - { method: PATCH, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}/drafts/{draft_id}" }
      - { method: POST, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}/drafts/{draft_id}/review" }
      - { method: POST, path: "/api/v1/projects/{project_id}/external-capture/sessions/{session_id}/drafts/{draft_id}/promote" }
    exports: []
    entities: [ExternalCaptureSession, ExternalCaptureDraft, CatalogIntegration]
    supported_actions: [inspect immutable customer evidence, edit governed proposal, revalidate proposal, approve proposal, reject proposal, promote approved proposal, run Import Correction Agent]
    unsupported_claims: [upload the source workbook automatically, invent required evidence, overwrite source values, auto-approve pattern recommendations, promote unapproved proposals]
    keywords: [capture review, external evidence, customer workbook, normalization, TBQ, payload KB, pattern recommendation, missing evidence, promotion]

  - id: capture
    name: Capture
    purpose: Create one governed catalog integration manually through a guided five-step workflow when no workbook import is needed.
    purpose_es: Crear manualmente una integración gobernada mediante un flujo guiado de cinco pasos cuando no se necesita importar un workbook.
    when_to_use: Use Capture when the architect needs to enter one integration directly, validate its required source and destination evidence, inspect potential duplicates, and review QA readiness before catalog creation.
    when_to_use_es: Usa Capture para registrar directamente una integración, validar la evidencia obligatoria de origen y destino, revisar posibles duplicados y confirmar su preparación de QA antes de crearla en el catálogo.
    steps:
      - Enter integration identity: brand, business process, and interface name.
      - Capture source and destination systems, then review any potential duplicate route matches.
      - Complete technical sizing and final review before creating the governed catalog record.
    steps_es:
      - Captura la identidad de la integración: marca, proceso de negocio y nombre de interfaz.
      - Registra origen y destino, y revisa los posibles duplicados de esa ruta.
      - Completa el dimensionamiento técnico y la revisión final antes de crear el registro gobernado en el catálogo.
    routes:
      - /projects/[projectId]/capture
      - /projects/[projectId]/capture/new
    endpoints:
      - { method: POST, path: "/api/v1/catalog/{project_id}" }
      - { method: GET, path: "/api/v1/catalog/{project_id}/duplicates" }
    exports: []
    entities: [CatalogIntegration, AuditEvent]
    supported_actions: [open guided capture, create one integration manually, validate required fields, inspect duplicate candidates, preview technical sizing, review QA readiness]
    unsupported_claims: [discover OCI resources automatically, scan a tenancy, bypass required field validation, create a duplicate silently]
    keywords: [capture, captura manual, guided capture, wizard, asistente de captura, nueva integración, duplicate, duplicado, source, origen, destination, destino]

  - id: catalog
    name: Catalog and QA
    purpose: Maintain the governed integration record, source lineage, architecture fields, QA reasons, volumetry inputs, pattern assignment, and saved design canvas for each integration.
    purpose_es: Mantener por integración el registro gobernado, linaje de origen, campos de arquitectura, razones de QA, entradas de volumetría, patrón y diseño guardado.
    when_to_use: Use Catalog and QA to search integration records, remediate evidence gaps, review one integration, or recalculate technical results.
    when_to_use_es: Usa Catalog and QA para buscar integraciones, corregir brechas de evidencia, revisar una línea o recalcular resultados técnicos.
    steps:
      - Filter or search the catalog to locate the integration or QA condition.
      - Open an integration to inspect source data, lineage, QA reasons, selected pattern, volumetry, and canvas.
      - Apply explicit architect-owned changes, refresh QA, and recalculate when the governed inputs are ready.
    steps_es:
      - Filtra o busca el catálogo para localizar la integración o condición de QA.
      - Abre la integración y revisa fuente, linaje, razones de QA, patrón, volumetría y canvas.
      - Guarda cambios explícitos del arquitecto, actualiza QA y recalcula cuando la evidencia esté lista.
    routes:
      - /projects/[projectId]/catalog
      - /projects/[projectId]/catalog/[integrationId]
    endpoints:
      - { method: GET, path: "/api/v1/catalog/{project_id}" }
      - { method: GET, path: "/api/v1/catalog/{project_id}/{integration_id}" }
      - { method: PATCH, path: "/api/v1/catalog/{project_id}/{integration_id}" }
      - { method: GET, path: "/api/v1/catalog/{project_id}/{integration_id}/lineage" }
      - { method: POST, path: "/api/v1/catalog/{project_id}/refresh-qa" }
      - { method: POST, path: "/api/v1/recalculate/{project_id}" }
    exports:
      - method: GET
        path: /api/v1/exports/{project_id}/xlsx
        media_types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
    entities: [CatalogIntegration, SourceIntegrationRow, JustificationRecord, PatternDefinition]
    supported_actions: [filter catalog, inspect lineage, edit architect fields, refresh QA, design canvas, recalculate, export catalog XLSX]
    unsupported_claims: [invent missing evidence, turn QA green automatically, mutate an approved design without saving]
    keywords: [catalog, catálogo, qa, calidad, integration, integración, lineage, linaje, canvas, volumetry, volumetría, recalculation, recálculo, source row]

  - id: patterns
    name: Patterns
    purpose: Govern the reusable, tool-agnostic integration patterns that guide architecture selection, QA explanations, canvas recommendations, and exports.
    purpose_es: Gobernar patrones de integración reutilizables e independientes de herramientas que orientan selección de arquitectura, QA, recomendaciones del canvas y exports.
    when_to_use: Use Patterns to understand when a pattern applies, its anti-pattern, technical flow, business value, and certified implementation guidance.
    when_to_use_es: Usa Patterns para entender cuándo aplica un patrón, su anti-patrón, flujo técnico, valor de negocio y guía certificada.
    steps:
      - Open Patterns and select a pattern by code or name.
      - Review its description, when-to-use guidance, anti-pattern, flow, supported status, and mapped services.
      - Return to an integration to assign the pattern and validate the design against governed guidance.
    routes: ["/admin/patterns"]
    endpoints:
      - { method: GET, path: /api/v1/patterns/ }
      - { method: GET, path: "/api/v1/patterns/{pattern_id}" }
      - { method: PATCH, path: "/api/v1/patterns/{pattern_id}" }
    exports: []
    entities: [PatternDefinition]
    supported_actions: [list patterns, inspect pattern guidance, edit governed pattern metadata, assign pattern from an integration]
    unsupported_claims: [execute an integration pattern, deploy OCI resources from the pattern library]
    keywords: [pattern, patrón, patrones, anti-pattern, anti-patrón, request-reply, request and reply, solicitud respuesta, event-driven, eventos, cdc, certification, technical flow, flujo técnico]

  - id: library
    name: Library
    purpose: Provide the administration hub for governed patterns, Service Products, dictionaries, assumptions, and deterministic synthetic validation assets.
    purpose_es: Proveer el centro de administración para patrones, Service Products, diccionarios, supuestos y activos de validación sintética gobernados.
    when_to_use: Use Library when the shared reference data that governs every project must be inspected or maintained.
    when_to_use_es: Usa Library cuando necesites consultar o mantener los datos de referencia compartidos que gobiernan todos los proyectos.
    steps:
      - Open Library and choose the reference category you need.
      - Inspect its current version, evidence, limits, interoperability, or synthetic validation history.
      - Make authorized changes in the category-specific workspace so downstream calculations use one governed source.
    routes:
      - /admin
      - /admin/services
      - /admin/services/[serviceId]
      - /admin/synthetic
      - /admin/synthetic/[jobId]
    endpoints:
      - { method: GET, path: /api/v1/service-products }
      - { method: GET, path: /api/v1/service-products/limit-assurance }
      - { method: GET, path: "/api/v1/service-products/{service_id}" }
      - { method: GET, path: "/api/v1/service-products/{service_id}/limits" }
      - { method: GET, path: "/api/v1/service-products/{service_id}/interoperability" }
      - { method: GET, path: /api/v1/admin/synthetic/jobs }
    exports: []
    entities: [ServiceCapabilityProfile, ServiceProductVersion, ServiceLimit, ServiceLimitEvidenceClaim, ServiceInteroperabilityRule, SyntheticGenerationJob]
    supported_actions: [open governance category, inspect service evidence, inspect claim-level limit assurance, inspect limits, inspect interoperability, run synthetic validation]
    unsupported_claims: [edit Oracle public documentation, deploy a Service Product directly]
    keywords: [library, biblioteca, service product, service products, producto de servicio, productos OCI, limits, límites, interoperability, interoperabilidad, synthetic lab, governance, gobierno]

  - id: dictionaries
    name: Dictionaries
    purpose: Govern the option sets and normalization aliases used consistently by capture, import, catalog, QA, and calculation workflows.
    when_to_use: Use Dictionaries to inspect or administer accepted values such as frequency, trigger, tool, and other governed classifications.
    steps:
      - Open Dictionaries and choose a category.
      - Review each code, display value, aliases, active state, and category metadata.
      - Add or update an option as an administrator, then validate the affected capture or import flow.
    routes: ["/admin/dictionaries", "/admin/dictionaries/[category]"]
    endpoints:
      - { method: GET, path: /api/v1/dictionaries/ }
      - { method: GET, path: "/api/v1/dictionaries/{category}" }
      - { method: POST, path: "/api/v1/dictionaries/{category}" }
      - { method: PATCH, path: "/api/v1/dictionaries/{category}/{option_id}" }
    exports: []
    entities: [DictionaryOption]
    supported_actions: [list dictionary categories, inspect options, add option, edit option, deactivate option]
    unsupported_claims: [normalize an unknown value without review, change historical source evidence]
    keywords: [dictionary, frequency, trigger, tool, option, code, alias, normalization]

  - id: assumptions
    name: Assumptions
    purpose: Version client workload assumptions that are not supplied by captured integrations and affect project-wide technical or deployment calculations.
    when_to_use: Use Assumptions when a missing client input needs an explicit, versioned default rather than a hidden hard-coded value.
    steps:
      - Open Assumptions and inspect the default version.
      - Open a version to review its client workload inputs and rationale.
      - Create or update a version, then explicitly make it the default before recalculating affected projects.
    routes: ["/admin/assumptions", "/admin/assumptions/[version]"]
    endpoints:
      - { method: GET, path: /api/v1/assumptions/ }
      - { method: GET, path: "/api/v1/assumptions/{version}" }
      - { method: PATCH, path: "/api/v1/assumptions/{version}" }
      - { method: POST, path: "/api/v1/assumptions/{version}/default" }
    exports: []
    entities: [AssumptionSet]
    supported_actions: [list assumption versions, inspect default, create version, edit version, set default]
    unsupported_claims: [replace Oracle service limits with client assumptions, rewrite previous snapshots]
    keywords: [assumption, default, workload input, version, client variable]

  - id: pricing
    name: Pricing
    purpose: Govern Oracle commercial evidence from source capture through classification, deterministic validation, human approval, immutable release, and BOM calculation readiness.
    purpose_es: Gobernar la evidencia comercial Oracle desde su captura y clasificación hasta la validación, aprobación humana, release inmutable y preparación para el cálculo del BOM.
    when_to_use: Use Pricing to synchronize public prices, inspect SKU identity and terms, resolve review candidates, approve commercial evidence, and publish a release that BOM can consume.
    steps:
      - Inspect the active sources, snapshots, documents, candidates, exceptions, and product coverage.
      - Review unresolved identity, metric, dependency, term, or fixture evidence with an explicit rationale.
      - Finalize approved evidence and promote an immutable commercial release before using its SKUs in BOM scenarios.
    routes: ["/admin/pricing"]
    endpoints:
      - { method: GET, path: /api/v1/pricing/sources }
      - { method: GET, path: /api/v1/pricing/commercial-catalog }
      - { method: POST, path: "/api/v1/pricing/commercial-candidates/{candidate_id}/review" }
      - { method: POST, path: "/api/v1/pricing/commercial-documents/{document_id}/finalize-review" }
      - { method: POST, path: "/api/v1/pricing/commercial-documents/{document_id}/releases" }
      - { method: GET, path: /api/v1/pricing/product-coverage }
    exports: []
    entities: [PriceCatalogSnapshot, PriceItem, CommercialMappingCandidate, CommercialException, CommercialRelease, ProductCoverageCandidate]
    supported_actions: [synchronize pricing, import authorized customer rate card, inspect SKU description, review candidate, resolve exception, finalize catalog review, promote commercial release, review product coverage, track Oracle price changes before approval, resolve SKU by approved predicates, inspect quote readiness]
    unsupported_claims: [approve evidence automatically, silently substitute a customer rate, treat a part number alone as quote-ready]
    keywords: [pricing, precios, tarifa, tarifas, sku, part number, commercial release, payg, annual commitment, candidate, exception, excepción, price, precio, costo]

  - id: bom
    name: BOM & Cost
    purpose: Convert approved technical demand into deployment-aware OCI quantities and an immutable cost estimate using approved products, SKUs, commercial rules, environments, and monthly activation ramps.
    purpose_es: Convertir demanda técnica aprobada en cantidades OCI conscientes del despliegue y una estimación inmutable usando productos, SKUs, reglas comerciales, ambientes y rampas mensuales.
    when_to_use: Use BOM and Cost after technical inputs and commercial coverage are ready to compare deployment scenarios, calculate monthly consumption, and publish a governed planning estimate.
    steps:
      - Create or open a deployment scenario and define region, currency, contract timing, environments, products, exact commercial variants, metrics, quantities, and activation schedules.
      - Generate a BOM job from the approved scenario and inspect every line's SKU, unit, quantity, tier, price, warnings, and provenance.
      - Review or publish a complete snapshot, compare alternatives, and download the governed XLSX, JSON, or PDF artifact.
    routes: ["/projects/[projectId]/bom"]
    endpoints:
      - { method: GET, path: "/api/v1/projects/{project_id}/selectable-products" }
      - { method: GET, path: "/api/v1/projects/{project_id}/selectable-products/{service_id}/metric-options" }
      - { method: POST, path: "/api/v1/projects/{project_id}/deployment-scenarios" }
      - { method: POST, path: "/api/v1/projects/{project_id}/bom-jobs" }
      - { method: POST, path: "/api/v1/projects/{project_id}/bom-snapshots/{snapshot_id}/review" }
    exports:
      - method: GET
        path: "/api/v1/projects/{project_id}/bom-snapshots/{snapshot_id}/exports/xlsx"
        media_types: [application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
      - method: GET
        path: "/api/v1/projects/{project_id}/bom-snapshots/{snapshot_id}/exports/json"
        media_types: [application/json]
      - method: GET
        path: "/api/v1/projects/{project_id}/bom-snapshots/{snapshot_id}/exports/pdf"
        media_types: [application/pdf]
    entities: [DeploymentScenario, DeploymentEnvironmentPlan, DeploymentRampPhase, BomJob, BomSnapshot, BomLineItem, BomLinePeriod]
    supported_actions: [create scenario, choose governed product, select SKU metric option, choose BYOL or License Included by environment, plan separate DEV QA PROD and DR environments, plan environment ramp, generate BOM, compare deployment scenarios, compare governed BOM snapshots, review provenance, publish BOM, export XLSX, export JSON, export PDF]
    unsupported_claims: [drag and drop OCI components, configure OCI instances directly, save a BOM as CSV, configure cost threshold email alerts, automatically provision OCI resources, treat a planning estimate as an Oracle quote]
    keywords: [bom, bill of materials, costo, costos, cost, sku selection, environment, ambiente, scenario, escenario, monthly ramp, rampa mensual, quantity, cantidad, estimate, estimación, export, exportar, licensing, license included, byol, licencia]

  - id: agents
    name: Agents
    purpose: Monitor governed OCI Generative AI agents, their authorized evidence tools, execution states, provider telemetry, proposals, and explicit human decisions.
    purpose_es: Monitorear agentes gobernados de OCI Generative AI, sus herramientas de evidencia, estados de ejecución, telemetría, propuestas y decisiones humanas.
    when_to_use: Use Agents to inspect why an agent produced an outcome, monitor runtime health, cancel active work, or decide an approval-gated proposal.
    steps:
      - Open Agent Operations and review provider readiness, resilience signals, definitions, and retained executions.
      - Inspect a run to see its governed evidence, decision workspace, output quality, and proposal state.
      - Approve or reject a reviewable proposal; execute only proposals whose deterministic action remains valid.
    routes: ["/admin/agents"]
    endpoints:
      - { method: GET, path: /api/v1/agents }
      - { method: GET, path: /api/v1/agents/runs }
      - { method: POST, path: /api/v1/agents/runs }
      - { method: GET, path: "/api/v1/agents/runs/{run_id}" }
      - { method: POST, path: "/api/v1/agents/runs/{run_id}/approvals/{approval_id}" }
    exports: []
    entities: [AgentRun, AgentStep, AgentApproval, AgentArtifact, SupportConversation, SupportMessage]
    supported_actions: [list agents, inspect run, cancel run, review proposal, execute approved deterministic proposal, inspect provider telemetry]
    unsupported_claims: [let an agent write arbitrary SQL, let an agent publish unreviewed changes, expose chain of thought]
    keywords: [agent, agente, assistant, asistente, conversación, contexto, run, ejecución, proposal, approval, provider, telemetry, telemetría, grounding]

  - id: ai-review
    name: AI Review
    purpose: Produce an evidence-backed architecture decision brief that explains deterministic findings, compares bounded recommendations, and keeps every catalog mutation behind explicit approval.
    when_to_use: Use AI Review from a project or integration when architecture readiness, QA, design compatibility, stress, drift, or remediation alternatives need a governed review.
    steps:
      - Start a project or integration review from its contextual action.
      - Read the current recommendation, what was found, why it matters, next actions, readiness, and supporting evidence before historical runs.
      - Select or accept a recommendation only when its deterministic patch and validation plan are appropriate; then recalculate and review the outcome.
    routes: []
    endpoints:
      - { method: POST, path: "/api/v1/ai-reviews/projects/{project_id}" }
      - { method: GET, path: "/api/v1/ai-reviews/{job_id}" }
      - { method: POST, path: "/api/v1/ai-reviews/{job_id}/findings/{finding_id}/accept" }
      - { method: POST, path: "/api/v1/ai-reviews/{job_id}/findings/{finding_id}/apply-patch" }
    exports:
      - method: GET
        path: /api/v1/ai-reviews/{job_id}/export
        media_types: [text/markdown; charset=utf-8]
    entities: [AiReviewJob, AiReviewBaseline, AgentRun]
    supported_actions: [start architecture review, inspect decision brief, compare recommendations, accept finding, apply approved patch, export Markdown]
    unsupported_claims: [approve an architecture automatically, mutate catalog data without explicit approval, send Architecture Review results to Slack, treat model prose as deterministic evidence]
    keywords: [ai review, architecture review, readiness, remediation, recommendation, drift, stress, decision brief]

semantic_examples:
  - { id: concept-app-overview-es, text: "¿Qué resuelve OCI DIS Architect?", section_id: projects, intent: concept_explanation, mode: knowledge, answer: "OCI DIS Architect convierte catálogos de integraciones en evidencia gobernada para importar, normalizar, revisar QA, calcular volumetría, diseñar topología y preparar escenarios BOM sin perder linaje ni control humano." }
  - { id: concept-project-es, text: "¿Qué es un proyecto dentro de la aplicación?", section_id: projects, intent: concept_explanation, mode: knowledge, answer: "Un proyecto es el espacio aislado de una evaluación de arquitectura: reúne sus integraciones, importaciones, dashboard técnico, topología, escenarios y artefactos gobernados." }
  - { id: concept-dashboard-es, text: "¿Qué información muestra el Dashboard?", section_id: projects, intent: concept_explanation, mode: knowledge, answer: "El Dashboard resume la evidencia técnica del proyecto: cobertura, completitud, mezcla de patrones, distribución de payload, madurez y riesgos priorizados desde el snapshot vigente." }
  - { id: concept-topology-es, text: "¿Para qué sirve el mapa de topología?", section_id: projects, intent: concept_explanation, mode: knowledge, answer: "El mapa muestra las dependencias de origen a destino del catálogo y permite investigar sistemas, vecinos, rutas y concentraciones de integraciones dentro del proyecto." }
  - { id: workflow-volumetry-es, text: "¿Cómo calculo la volumetría de las integraciones?", section_id: catalog, intent: workflow_guidance, mode: knowledge }
  - { id: concept-service-product-es, text: "¿Qué representa un Service Product en la App?", section_id: library, intent: concept_explanation, mode: knowledge, answer: "Un Service Product es el perfil gobernado de una capacidad OCI que centraliza límites, interoperabilidad, reglas técnicas y preparación comercial para que diseño, cálculo y BOM consuman la misma fuente." }
  - { id: concept-assistant-es, text: "¿Cómo utiliza contexto el asistente general?", section_id: agents, intent: concept_explanation, mode: knowledge, answer: "El asistente recupera conocimiento gobernado y contexto explícito de la App para responder; la conversación ayuda a resolver referencias, pero las respuestas previas del modelo nunca se convierten en evidencia factual." }
  - { id: concept-app-exports-es, text: "¿Qué puedo exportar desde la App y qué evidencia conserva?", section_id: bom, intent: concept_explanation, mode: knowledge, answer: "Los formatos dependen del artefacto: el catálogo de integraciones se exporta como XLSX y conserva sus campos gobernados y linaje; el BOM se exporta como XLSX, JSON o PDF y conserva el snapshot inmutable con SKU, unidad, cantidad, tier, precio, advertencias y proveniencia; Architecture Review y el executive brief se exportan como Markdown con su evidencia gobernada." }
