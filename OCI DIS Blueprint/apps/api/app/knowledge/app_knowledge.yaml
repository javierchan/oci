  - { id: concept-sku, text: "What is an OCI SKU in this App?", section_id: pricing, intent: concept_explanation, mode: knowledge, answer: "A SKU is an Oracle commercial unit identified by part number, billing metric, edition or license terms, and governed pricing evidence." }
  - { id: concept-license-model-es, text: "¿Qué significa License Included o BYOL en un escenario?", section_id: bom, intent: concept_explanation, mode: knowledge, answer: "License Included incorpora el derecho de uso de software aplicable en la tarifa del servicio. BYOL usa licencias Oracle elegibles del cliente y requiere validar los términos y ratios de conversión antes de cotizar." }
  - { id: concept-scenario-snapshot, text: "What is the difference between a deployment scenario and a BOM snapshot?", section_id: bom, intent: concept_explanation, mode: knowledge, answer: "A deployment scenario is the editable approved plan for environments, products, metrics, quantities, and timing. A BOM snapshot is the immutable calculated result produced from that scenario and its exact technical and commercial evidence." }
  - { id: concept-sku-choice, text: "How is a SKU selected for a product and environment?", section_id: pricing, intent: concept_explanation, mode: knowledge, answer: "The App resolves a SKU deterministically from an approved product mapping and its environment predicates, such as edition, license model, metric, and commercial release." }
  - { id: concept-quote-ready, text: "What does quote-ready mean?", section_id: pricing, intent: concept_explanation, mode: knowledge, answer: "Quote-ready means the required commercial terms, rule fixtures, product mappings, release membership, and scenario inputs are approved with no open blockers. It does not turn the planning estimate into an Oracle quote." }
  - { id: concept-commercial-release, text: "What is a commercial release?", section_id: pricing, intent: concept_explanation, mode: knowledge, answer: "A commercial release is an immutable approved catalog scope of SKUs and governed rules that the BOM engine is allowed to consume." }
  - { id: concept-pattern-es, text: "Explica el patrón Request and Reply", section_id: patterns, intent: concept_explanation, mode: knowledge, answer: "Request and Reply es una interacción síncrona: el consumidor envía una solicitud y espera la respuesta del sistema destino en la misma conversación. Conviene cuando el resultado debe ser inmediato; no cuando el proceso es largo, desacoplado o tolera respuesta posterior." }
  - { id: concept-agents-boundary-es, text: "¿Qué hacen los agentes de OCI DIS y qué no pueden cambiar?", section_id: agents, intent: concept_explanation, mode: knowledge, answer: "Los agentes analizan evidencia gobernada, generan propuestas y registran su ejecución. No pueden ejecutar SQL arbitrario, publicar cambios sin la autorización exigida por el flujo ni convertir razonamiento del modelo en evidencia." }
